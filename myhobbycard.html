<!DOCTYPE html>

<html>
<head>

    <title>My Hobby Cards</title>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- STEP 1 - Bootstrap CSS link -->

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body{
            background-color: rgb(86, 167, 213);
            font-family: 'Times New Roman', Times, serif;
            padding: 30px 50px;
        }

        h1{
            text-align: center;
            background: snow;
        }

        .hobby-card{
            text-align: center;
            border: 2px solid lightblue;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: turquoise;
        }

        .hobby-card h3{
            color: aliceblue;
        }
    </style>
</head>
<body>
    <h1>my hobby card</h1>
    <div class="container">
    <div class="row">
    <div class="col-12 col-md-6 col-lg-4">
    <div class="hobby-card">
    <h3>coding</h3>
    <p>i am doing it right now...</p>
</div>
</div>

<div class="container">
    <div class="row">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>more coding...</h3>
                <p>i am doing it right now...</p>
            </div>
        </div>

        <div class="container">
            <div class="row">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>more&more coding...</h3>
                        <p>i am doing it right now...</p>
                    </div>
                </div>
                </div>
                </div>
</body>
</html>
