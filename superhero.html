<html>
    <head>
        <title>my superhero card</title>
    <style>
        body{
            background-color: rgb(183, 181, 232);
            color: azure;
            font-family: Arial,sans-serif;
        }

        .hero-name{
            font-size: 60px;
            font-weight: bold;
            color: azure;
            text-shadow: 3px 3px lightblue;
        }

         .tagline{
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
         }
       
          .label{
            text-transform: uppercase;
            text-decoration: underline;
            color: lightblue;
         }

          .power{
            font-weight:bold ;
            color: lightgreen;
            text-transform: capitalize;
         }

         .weakness{
            text-decoration: line-through;
            color: beige;
         }

         .badge{
            font-size: 28px;
            font-weight: bold;
            color: goldenrod;
            transform: rotate(15deg);
         }

         .made-by{
            color: red;
            font-style: italic;
         }
    </style>
</head>
<body>
    <h1 class="hero-name">bajarangbali</h1>
    <p class="tagline">the most powerful boy in the class</p>

    <h2 class="label">super powers</h2>
    <p class="power">can run faster than a cheetah</p>
<p class="power">can lift 10 school buses at a time</p>

<h2 class="label">weakness</h2>
<p class="weakness">homework</p>
<p class="weakness">gobi</p>

<p class="badge">top hero</p>
<p class="made-by">created by shlok</p>
</body>
</html>
